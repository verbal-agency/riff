services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${RIFF_POSTGRES_DB:-riff}
      POSTGRES_USER: ${RIFF_POSTGRES_USER:-riff}
      POSTGRES_PASSWORD: ${RIFF_POSTGRES_PASSWORD:?Set RIFF_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${RIFF_POSTGRES_USER:-riff} -d $${RIFF_POSTGRES_DB:-riff}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
