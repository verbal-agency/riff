<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riff | Verbal Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #06122b; --paper: #eef2f4; --white: #fff; --pink: #ff3d8b; --pink-ink: #c4175f; --cyan: #5ee3f0;
    --mint: #d1f1ed; --rose: #f3bcd5; --blue: #b0c5f7; --mist: #e5eaf7; --muted: #4a5568; --faint: #9fb0c8;
    --display: Anton, Impact, "Arial Narrow Bold", sans-serif;
    --mono: "JetBrains Mono", "Courier New", monospace;
    --label: "Space Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; border-radius: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14.5px/1.6 var(--mono); display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; cursor: pointer; }
  ::selection { background: var(--pink); color: var(--white); }

  /* Site header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 24px; flex-wrap: wrap; }
  .mark { font: 700 13.6px var(--label); text-transform: uppercase; color: var(--ink); text-decoration: none; }
  .top nav { display: flex; gap: 10px; flex-wrap: wrap; }
  .top nav a { font: 700 13.6px var(--label); text-transform: uppercase; color: var(--ink); text-decoration: none; background: var(--paper);
               border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 6px 14px; }
  .top nav a:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  .top nav a[aria-current] { background: var(--ink); color: var(--paper); box-shadow: 4px 4px 0 var(--pink); }

  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 440px) 1fr; }
  .side { overflow-y: auto; padding: 14px 24px 48px; }
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--ink); color: var(--paper); border-top: 3px solid var(--ink); }

  /* Left: the digest */
  h1 { font: 400 64px/0.92 var(--display); text-transform: uppercase; letter-spacing: 0.004em; margin: 6px 0 12px; }
  h1 i { font-style: normal; color: var(--pink); }
  .bar { height: 8px; background: var(--pink); margin-bottom: 12px; }
  .sub { font-size: 13.5px; margin-bottom: 8px; }
  h2 { font: 700 12px var(--label); text-transform: uppercase; color: var(--pink-ink); margin: 26px 0 12px; }
  h2::after, .kicker::after { content: ""; display: inline-block; width: 7px; height: 7px; background: currentColor; margin-left: 7px; }
  .card { display: block; width: calc(100% - 6px); text-align: left; background: var(--mist); border: 3px solid var(--ink); padding: 12px 14px; margin-bottom: 14px;
          box-shadow: 4px 4px 0 var(--ink); transition: transform 0.08s, box-shadow 0.08s; }
  .card:nth-of-type(4n+1) { background: var(--mint); }
  .card:nth-of-type(4n+2) { background: var(--rose); }
  .card:nth-of-type(4n+3) { background: var(--blue); }
  .card:hover, .card:focus-visible { box-shadow: 6px 6px 0 var(--pink); outline: none; }
  .card:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--pink); }
  .card.active { background: var(--ink); color: var(--paper); box-shadow: 6px 6px 0 var(--pink); }
  .card b { display: block; font: 700 15px/1.35 var(--mono); }
  .card span { display: block; font-size: 12.5px; line-height: 1.5; margin-top: 6px; opacity: 0.85; }
  .tag { font: 700 10.5px var(--label); font-style: normal; text-transform: uppercase; border: 2px solid currentColor; padding: 0 5px; margin-left: 8px; white-space: nowrap; vertical-align: 1px; }

  /* Right: the thread */
  .head { padding: 22px 28px 16px; border-bottom: 3px solid var(--paper); display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .head > div { flex: 1 1 280px; min-width: 0; }
  .kicker { font: 700 12px var(--label); text-transform: uppercase; color: var(--pink); margin-bottom: 6px; }
  .head h3 { font: 400 34px/1 var(--display); text-transform: uppercase; letter-spacing: 0.004em; margin: 0; }
  .head button, form button { font: 700 12.5px var(--label); text-transform: uppercase; background: var(--ink); color: var(--paper); border: 3px solid var(--paper); padding: 7px 13px; }
  .head button:hover, form button:hover { background: var(--paper); color: var(--ink); }
  .talk { flex: 1; overflow-y: auto; padding: 24px 28px; }
  .talk > * { max-width: 740px; }
  .seed { font-size: 13.5px; color: var(--faint); border-left: 3px solid var(--pink); padding-left: 12px; margin-bottom: 24px; }
  .msg { margin-bottom: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.riff { font-size: 15px; line-height: 1.7; }
  .msg.you { background: var(--paper); color: var(--ink); border: 3px solid var(--paper); box-shadow: 5px 5px 0 var(--pink); padding: 8px 13px; width: fit-content; max-width: 600px; margin-left: auto; margin-right: 6px; font-weight: 700; }
  .srcs { font-size: 12px; line-height: 1.55; margin-top: 12px; white-space: normal; border-top: 1px solid #2a3a5c; padding-top: 8px; }
  .srcs a { display: block; color: var(--cyan); text-decoration: none; }
  .srcs a::before { content: "↗ "; }
  .srcs a:hover { text-decoration: underline; }
  .chips { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; margin: 0 0 26px; }
  .chip { background: transparent; color: var(--paper); border: 2px solid var(--faint); padding: 7px 12px; text-align: left; font-size: 13.5px; line-height: 1.45; }
  .chip::before { content: "→ "; color: var(--pink); font-weight: 700; }
  .chip:hover { border-color: var(--cyan); background: var(--cyan); color: var(--ink); }
  .chip:hover::before { color: var(--ink); }
  .sketch { background: var(--paper); color: var(--ink); border: 3px solid var(--paper); box-shadow: 6px 6px 0 var(--pink); padding: 6px 20px 16px; margin: 6px 6px 26px 0; }
  .sketch h4 { font: 400 30px/1 var(--display); text-transform: uppercase; margin: 16px 0 8px; }
  .sketch h5 { font: 700 12px var(--label); text-transform: uppercase; color: var(--pink-ink); margin: 18px 0 4px; }
  .sketch p { margin: 5px 0; }
  .sketch a { color: var(--ink); }
  .wait { color: var(--cyan); font: 700 12.5px var(--label); text-transform: uppercase; }
  .wait::after { content: " ■"; animation: blink 0.9s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .wait::after { animation: none; } .card, .top nav a { transition: none; } }
  .err { color: var(--pink); font-weight: 700; margin-bottom: 14px; }
  form { display: flex; gap: 10px; padding: 14px 28px 20px; border-top: 3px solid var(--paper); align-items: stretch; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--white); border: 3px solid var(--paper); padding: 10px 12px; min-height: 48px; max-height: 160px; }
  textarea:focus { outline: 3px solid var(--cyan); outline-offset: 0; }
  form button.go { background: var(--cyan); color: var(--ink); border-color: var(--cyan); }
  form button.go:hover { background: var(--pink); border-color: var(--pink); color: var(--white); }
  button:disabled { opacity: 0.45; cursor: default; }
  .empty { margin: 7vh auto 0; max-width: 460px; padding: 12px; }
  .empty p { font: 400 44px/0.98 var(--display); text-transform: uppercase; margin: 0 0 18px; }
  .empty p::after { content: "."; color: var(--pink); }
  .empty small { display: block; font-size: 14px; line-height: 1.6; color: var(--faint); }
  .empty::after { content: ""; display: block; width: 150px; height: 22px; margin-top: 26px; background-image: radial-gradient(var(--faint) 1.5px, transparent 1.6px); background-size: 14px 14px; }
  .back { display: none; }
  @media (max-width: 800px) {
    .top { padding: 12px 16px; }
    .app { grid-template-columns: 1fr; }
    .main { display: none; }
    .app.open .side { display: none; }
    .app.open .main { display: flex; }
    .back { display: inline-block; }
    .side { padding: 8px 16px 40px; }
    .head, .talk, form { padding-left: 16px; padding-right: 16px; }
    h1 { font-size: 52px; }
    .head h3 { font-size: 26px; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="mark" href="https://verbalagency.com/">Verbal Agency</a>
  <nav>
    <a href="https://verbalagency.com/notes/">Notes</a>
    <a href="https://verbalagency.com/principles/">Principles</a>
    <a href="https://verbalagency.com/#check">Check</a>
    <a href="/riff" aria-current="page">Riff</a>
    <a href="https://verbalagency.com/">Contact</a>
  </nav>
</header>
<div class="app" id="app">
  <aside class="side">
    <h1>Let it collide<i>.</i></h1>
    <div class="bar"></div>
    <div class="sub" id="sub">Loading…</div>
    <div id="lists"></div>
  </aside>
  <section class="main">
    <div class="head" id="head" hidden>
      <div>
        <button class="back" id="back">← Digest</button>
        <div class="kicker">Riffing on</div>
        <h3 id="title"></h3>
      </div>
      <button id="distill" title="Write down what this conversation arrived at">Distill into a sketch</button>
    </div>
    <div class="talk" id="talk"></div>
    <form id="form">
      <textarea id="box" rows="1" placeholder="Say something to start a riff from nothing…"></textarea>
      <button type="button" id="wander" title="Throw two unrelated articles into the conversation" hidden>Wander</button>
      <button class="go" id="send">Send</button>
    </form>
  </section>
</div>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
let digest = null, threads = [], thread = null, busy = false, error = null;

async function api(path, body) {
  const res = await fetch("/riff/api" + path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || ("Request failed (" + res.status + ")"));
  return data;
}

function card(title, blurb, tag, onClick, active) {
  const b = el("button", "card" + (active ? " active" : ""));
  const head = el("b", null, title);
  if (tag) head.append(el("i", "tag", tag));
  b.append(head);
  if (blurb) b.append(el("span", null, blurb));
  b.onclick = onClick;
  return b;
}

function renderSide() {
  const box = $("lists");
  box.replaceChildren();
  if (threads.length) {
    box.append(el("h2", null, "Your threads"));
    threads.forEach((t) => box.append(card(t.title, null, t.distilled ? "sketched" : (t.your_turns ? t.your_turns + (t.your_turns === 1 ? " turn" : " turns") : "unanswered"), () => openThread(t.thread_id), thread && thread.thread_id === t.thread_id)));
  }
  if (!digest) {
    $("sub").textContent = "No digest yet. Run ./scripts/riff-digest, or start from nothing.";
    return;
  }
  const p = digest.payload;
  $("sub").textContent = "Digest of " + digest.run_date + " · " + digest.article_count + " articles read";
  const section = (label, kind, items, blurb) => {
    if (!items || !items.length) return;
    box.append(el("h2", null, label));
    items.forEach((item, index) => box.append(card(item.title, blurb(item), item.single_source ? "single source" : null, () => start({ kind, index }))));
  };
  section("Collisions", "collision", p.collisions, (i) => i.question);
  section("Ideas", "idea", p.ideas, (i) => i.pitch);
  section("Themes", "theme", p.themes, (i) => i.what_is_happening);
}

function sources(list) {
  const box = el("div", "srcs");
  list.forEach((s) => { const a = el("a", null, s.source + " — " + s.title); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; box.append(a); });
  return box;
}

function sketch(markdown) {
  const box = el("div", "sketch");
  markdown.split("\n").forEach((line) => {
    if (line.startsWith("# ")) box.append(el("h4", null, line.slice(2)));
    else if (line.startsWith("## ")) box.append(el("h5", null, line.slice(3)));
    else if (line.startsWith("- [")) {
      const m = line.match(/^- \[(.*)\]\((.*)\)$/);
      if (m) { const p = el("p"); const a = el("a", null, m[1]); a.href = m[2]; a.target = "_blank"; a.rel = "noopener"; p.append(a); box.append(p); }
    } else if (line.trim()) box.append(el("p", null, line.replace(/\*\*/g, "")));
  });
  return box;
}

function renderThread() {
  const talk = $("talk");
  $("app").classList.toggle("open", !!thread || busy);
  $("head").hidden = !thread;
  $("wander").hidden = !thread;
  $("box").placeholder = thread ? "Yes, and…" : "Say something to start a riff from nothing…";
  ["send", "wander", "distill"].forEach((id) => ($(id).disabled = busy));
  talk.replaceChildren();
  if (!thread) {
    if (busy) talk.append(el("div", "wait", "Opening the thread…"));
    else { const e = el("div", "empty"); e.append(el("p", null, "Pull a thread"), el("small", null, "Pick a collision or an idea and start pulling on it. Or just say something below and see where it wanders.")); talk.append(e); }
    if (error) talk.append(el("div", "err", error));
    return;
  }
  $("title").textContent = thread.title;
  $("distill").textContent = thread.sketch ? "Distill again" : "Distill into a sketch";
  const seedText = thread.seed.question || thread.seed.pitch || thread.seed.what_is_happening;
  if (seedText) talk.append(el("div", "seed", seedText));
  thread.messages.forEach((m, i) => {
    const node = el("div", "msg " + m.role, m.content);
    if (m.sources.length) node.append(sources(m.sources));
    talk.append(node);
    if (m.role === "riff" && i === thread.messages.length - 1 && m.tangents.length && !busy) {
      const chips = el("div", "chips");
      m.tangents.forEach((t) => { const c = el("button", "chip", t); c.onclick = () => say(t); chips.append(c); });
      talk.append(chips);
    }
  });
  if (thread.sketch) talk.append(sketch(thread.sketch));
  if (busy) talk.append(el("div", "wait", "Thinking…"));
  if (error) talk.append(el("div", "err", error));
  talk.scrollTop = talk.scrollHeight;
}

async function run(work) {
  if (busy) return;
  busy = true; error = null; renderThread();
  try { await work(); } catch (e) { error = e.message; }
  busy = false;
  try { threads = (await api("/state")).threads; } catch (e) {}
  renderSide(); renderThread();
}

const start = (body) => { thread = null; return run(async () => { thread = await api("/threads", body); }); };
const openThread = (id) => run(async () => { thread = await api("/threads/" + id); });
function say(text, wander) {
  text = (text || "").trim();
  if (!thread) return text ? start({ kind: "free", text }) : null;
  if (!text && !wander) return;
  if (text) thread.messages.push({ role: "you", content: text, sources: [], tangents: [] });
  return run(async () => { thread = await api("/threads/" + thread.thread_id + "/messages", { text: text || null, wander: !!wander }); });
}

$("form").onsubmit = (e) => { e.preventDefault(); const text = $("box").value; $("box").value = ""; $("box").style.height = ""; say(text); };
$("box").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } };
$("box").oninput = (e) => { e.target.style.height = ""; e.target.style.height = Math.min(e.target.scrollHeight, 160) + "px"; };
$("wander").onclick = () => { const text = $("box").value; $("box").value = ""; say(text, true); };
$("distill").onclick = () => run(async () => { thread = await api("/threads/" + thread.thread_id + "/distill", {}); });
$("back").onclick = () => { thread = null; error = null; renderSide(); renderThread(); };

(async () => {
  try { const s = await api("/state"); digest = s.digest; threads = s.threads; } catch (e) { $("sub").textContent = e.message; }
  renderSide(); renderThread();
})();
</script>
</body>
</html>
